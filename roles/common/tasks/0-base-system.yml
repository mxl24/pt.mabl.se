---

- name: Enable SELinux
  ansible.posix.selinux: policy=targeted state=enforcing
  tags: system, etc-environment

- name: Set hostname
  ansible.builtin.hostname: name="{{ inventory_hostname }}"
  tags: system, etc-environment

- name: Set timezone to Europe/Stockholm
  ansible.builtin.copy: src=/usr/share/zoneinfo/Europe/Stockholm dest=/etc/localtime
  tags: system, etc-environment

- name: Better bash history for root user
  ansible.builtin.blockinfile:
    dest: /root/.bashrc
    owner: root
    mode: 0644
    marker: "# {mark} ANSIBLE MANAGED BLOCK common"
    block: |
      HISTFILESIZE=10000000
      HISTSIZE=10000
      HISTCONTROL=ignoreboth
      HISTTIMEFORMAT='%y-%m-%dT%T  '
      shopt -s cmdhist
      shopt -s histappend
      PROMPT_COMMAND='history -a'
  tags: system, etc-environment

- name: Install firewalld
  ansible.builtin.yum: name=firewalld state=present
  tags: system, firewall

- name: Set firewalld to running and enabled
  ansible.builtin.service: name=firewalld state=started enabled=yes
  tags: system, firewall

- name: Allow incoming SSH traffic in firewalld
  ansible.posix.firewalld: service=ssh permanent=true state=enabled
  register: base_system_firewalld_ssh_enabled
  tags: system, firewall

- name: Restart firewalld if SSH access changed
  ansible.builtin.service: name=firewalld state=restarted
  when: base_system_firewalld_ssh_enabled is changed
  tags: system, firewall

- name: Install NTP client
  ansible.builtin.yum: name=chrony state=present
  tags: system

- name: NTP client running and enabled
  ansible.builtin.service: name=chronyd state=started enabled=yes
  tags: system

- name: Install 'development tools' package group
  ansible.builtin.yum: name="@Development tools" state=present
  tags: system, base-packages

- name: Install git, wget, man, man-pages, et cetera
  ansible.builtin.yum:
    name:
      - git-all
      - wget
      - man
      - man-pages
      - bash-completion
      - lsof
      - jq
      - vim-enhanced
      - emacs-nox
      - tree
      - httpd-tools
      - createrepo
      - bzip2
      - unzip
      - pigz
      - open-vm-tools
      - telnet
      - traceroute
      - tcpdump
      - iotop
      - rsync
      - sysstat
      - tmux
    state: present
  tags: system, base-packages

- name: Disable Emacs backup files by default
  ansible.builtin.lineinfile:
    line: (setq make-backup-files nil)
    path: /usr/share/emacs/site-lisp/default.el
    state: present
  tags: system, base-packages

- name: Install mlocate and trigger updatedb
  ansible.builtin.yum: name=mlocate state=present
  notify: run updatedb
  tags: system, base-packages

...
