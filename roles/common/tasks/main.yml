---

- name: Run config tasks in 0-base-system.yml
  debug:
    msg: 'Running config tasks in common/tasks/0-base-system.yml for {{ inventory_hostname }}...'
  tags: system, base-packages, firewall, lvm, etc-environment

- name: Configure OS baseline with base packages and firewall
  ansible.builtin.include_tasks: 0-base-system.yml
  tags: system, base-packages, firewall, etc-environment

- name: Run config tasks in 1-sysadmin-users.yml
  debug:
    msg: 'Running config tasks in common/tasks/1-sysadmin-users.yml for {{ inventory_hostname }}...'
  tags: system, sysadmin-users, etc-environment

- name: Create sysadmin user and provision keys
  ansible.builtin.include_tasks: 1-sysadmin-users.yml
  tags: system, sysadmin-users, docker

- name: Run config tasks in 2-extra-packages.yml
  debug:
    msg: 'Running config tasks in common/tasks/2-extra-packages.yml for {{ inventory_hostname }}...'
  tags: system, extra-packages

- name: Install extra packages via EPEL and similar
  ansible.builtin.include_tasks: 2-extra-packages.yml
  tags: system, extra-packages

- name: Run config tasks in 3-python.yml
  debug:
    msg: 'Running config tasks in common/tasks/3-python.yml for {{ inventory_hostname }}...'
  tags: system, python

- name: Install Python interpreter and development libraries
  ansible.builtin.include_tasks: 3-python.yml
  tags: system, python

- name: Run config tasks in 4-java.yml
  debug:
    msg: 'Running config tasks in common/tasks/4-java.yml for {{ inventory_hostname }}...'
  tags: system, java, jenv

- name: Install OpenJDK and jEnv
  ansible.builtin.include_tasks: 4-java.yml
  tags: system, java, jenv

- name: Run config tasks in 5-docker.yml
  debug:
    msg: 'Running config tasks in common/tasks/5-docker.yml for {{ inventory_hostname }}...'
  tags: system, docker

- name: Install Docker Engine
  ansible.builtin.include_tasks: 5-docker.yml
  tags: system, docker

- name: Run config tasks in 6-crontab.yml
  debug:
    msg: 'Running config tasks in common/tasks/6-crontab.yml for {{ inventory_hostname }}...'
  tags: system, crontab

- name: Configure crontab entries
  ansible.builtin.include_tasks: 6-crontab.yml
  tags: system, crontab

