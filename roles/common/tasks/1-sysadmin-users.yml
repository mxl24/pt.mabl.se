---

- name: Assert sysadmins are named
  fail: msg="sysadmins must be listed"
  when: not (sysadmins | length)
  tags: system, sysadmin-users

- name: Configure sysadmin accounts
  ansible.builtin.user:
    name: "{{ item.user }}"
    password: "{{ item.passwd }}"
    groups: wheel
    append: yes
    state: present
    force: yes
  with_items: "{{ sysadmins }}"
  tags: system, sysadmin-users

- name: Set ~/.ssh/authorized_keys for sysadmins
  ansible.posix.authorized_key:
    user: "{{ item.user }}"
    key: "{{ lookup('file', 'public_keys/' + item.user + '_id_rsa.pub') }}"
    exclusive: yes
  with_items: "{{ sysadmins }}"
  tags: system, sysadmin-users

- name: Update .bashrc with better Bash history for sysadmins
  ansible.builtin.blockinfile:
    dest: "{{ '/home/' + item }}/.bashrc"
    create: yes
    owner: "{{ item }}"
    mode: 0644
    marker: "# {mark} ANSIBLE MANAGED BLOCK common"
    block: |
      HISTFILESIZE=10000000
      HISTSIZE=10000
      HISTCONTROL=ignoreboth
      HISTTIMEFORMAT='%y-%m-%dT%T  '
      shopt -s cmdhist
      shopt -s histappend
      PROMPT_COMMAND='history -a'
  with_items: "{{ (sysadmins | map(attribute='user') | list) }}"
  tags: system, sysadmin-users

- name: Disable password authentication and root login in /etc/ssh/sshd_config
  ansible.builtin.blockinfile:
    dest: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED BLOCK common"
    block: |
      Port {{ sshd_port }}
      PermitRootLogin no
      AllowUsers {{ sysadmins | map(attribute='user') | join(' ') }}
      Match Group wheel
      	PasswordAuthentication no
  register: sysadmin_users_sshd_config
  tags: system, sysadmin-users

- name: Update SELinux to allow SSH port {{ sshd_port }}
  ansible.builtin.shell: semanage port -a -t ssh_port_t -p tcp {{ sshd_port }}
  when: sysadmin_users_sshd_config is changed
  tags: system, sysadmin-users

- name: Restart sshd to apply config changes
  ansible.builtin.service: name=sshd state=restarted
  when: sysadmin_users_sshd_config is changed
  tags: system, sysadmin-users

...
